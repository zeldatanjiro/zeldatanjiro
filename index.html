<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOSSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#070707;
    --surface:#121212;
    --surface-2:#1b1b1b;
    --ink:#0a0a0a;
    --text:#fff8e7;
    --muted:#9d9686;
    --yellow:#ffd400;     /* jaune signature */
    --pink:#ff2e88;       /* accent néon */
    --teal:#18e0c4;
    --line:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0; color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px;
    background:
      repeating-linear-gradient(135deg, rgba(255,212,0,.035) 0 14px, transparent 14px 28px),
      var(--bg);
    min-height:100vh;
  }
  .display{font-family:"Anton","Impact",sans-serif; text-transform:uppercase; letter-spacing:.5px;}

  /* ---------- Bandeau titre ---------- */
  .hero{
    position:relative; overflow:hidden;
    margin:0 0 4px; padding:26px 18px 22px;
    background:var(--yellow); color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% 88%,0 100%);
  }
  .hero::after{
    content:""; position:absolute; right:-40px; top:-30px; width:180px; height:180px;
    background:var(--pink); opacity:.9; transform:rotate(18deg);
    clip-path:polygon(0 0,100% 0,60% 100%,0 60%);
  }
  .hero .logo{position:relative; z-index:1; font-size:52px; line-height:.9; margin:0;}
  .hero .sub{
    position:relative; z-index:1; margin:8px 0 0; display:inline-block;
    background:var(--ink); color:var(--yellow); font-weight:800; font-size:12px;
    letter-spacing:2px; text-transform:uppercase; padding:5px 10px; transform:skewX(-10deg);
  }
  .hero .sub span{display:inline-block; transform:skewX(10deg);}

  /* ---------- Onglets ---------- */
  .tabs{display:flex; gap:0; padding:16px 0 6px; overflow-x:auto; scrollbar-width:none; border-bottom:2px solid var(--line); margin:0 18px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 16px 9px; margin-right:6px; cursor:pointer;
    background:transparent; color:var(--muted); border:none;
    font-size:18px; letter-spacing:1px; white-space:nowrap;
  }
  .tab.active{color:var(--ink); background:var(--yellow); transform:skewX(-10deg);}
  .tab.active span{display:inline-block; transform:skewX(10deg);}

  /* ---------- Grille produits ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 18px;}
  .card{
    position:relative; background:var(--surface); border:2px solid var(--line);
    padding:0 0 12px; display:flex; flex-direction:column; overflow:hidden;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  }
  .card:hover{border-color:var(--yellow);}
  .visual{
    position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    font-size:58px; background:
      repeating-linear-gradient(45deg, rgba(255,46,136,.12) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, #1f1f1f, #0d0d0d);
    border-bottom:2px solid var(--yellow);
  }
  .tag{
    position:absolute; top:10px; left:10px; background:var(--pink); color:#fff;
    font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    padding:3px 8px; transform:skewX(-10deg);
  }
  .tag span{display:inline-block; transform:skewX(10deg);}
  .info{padding:10px 12px 0; display:flex; flex-direction:column; gap:4px; flex:1;}
  .name{margin:0; font-size:22px; line-height:1; color:var(--text);}
  .desc{font-size:11px; color:var(--muted);}
  .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px 0;}
  .price{font-family:"Anton",Impact,sans-serif; font-size:22px; color:var(--yellow); letter-spacing:.5px;}

  .add{
    width:42px; height:42px; border:none; background:var(--yellow); color:var(--ink);
    font-family:"Anton",Impact,sans-serif; font-size:26px; line-height:1; cursor:pointer;
    clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);
  }
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper button{
    width:34px; height:34px; border:none; background:var(--yellow); color:var(--ink);
    font-family:"Anton",Impact,sans-serif; font-size:20px; cursor:pointer;
  }
  .stepper button.minus{background:var(--surface-2); color:var(--text);}
  .stepper span{min-width:26px; text-align:center; font-family:"Anton",Impact,sans-serif; font-size:20px; color:var(--yellow);}

  /* ---------- Barre de commande ---------- */
  .cartbar{
    position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    display:none; align-items:stretch; justify-content:space-between;
    background:var(--pink); color:#fff; border:none; cursor:pointer;
    padding:0; box-shadow:0 0 0 2px var(--ink), 0 12px 30px rgba(255,46,136,.35);
    clip-path:polygon(0 0,100% 0,96% 100%,0 100%);
  }
  .cartbar.show{display:flex;}
  .cartbar:disabled{opacity:.6;}
  .cartbar .left{
    display:flex; align-items:center; padding:14px 16px; background:var(--ink); color:var(--yellow);
    font-family:"Anton",Impact,sans-serif; font-size:18px; letter-spacing:1px; text-transform:uppercase;
  }
  .cartbar .right{
    display:flex; align-items:center; padding:14px 22px 14px 14px;
    font-family:"Anton",Impact,sans-serif; font-size:20px; letter-spacing:1px; text-transform:uppercase;
  }

  footer.note{padding:20px; text-align:center; color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase;}
</style>
</head>
<body>

<header class="hero">
  <h1 class="logo display">NOSSA</h1>
  <p class="sub"><span>Meet up Besançon · Fleurs &amp; Résines</span></p>
</header>

<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<footer class="note">NOSSA 25</footer>

<button class="cartbar" id="cartbar" type="button">
  <span class="left" id="cb-left"></span>
  <span class="right" id="cb-right"></span>
</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#070707'); tg.setBackgroundColor('#070707'); } catch (e) {}

// ------------------------------------------------------------------
// TES PRODUITS — modifie librement cette liste (nom, description, prix, emoji, catégorie)
// Les onglets se génèrent automatiquement à partir des catégories.
// ------------------------------------------------------------------
const PRODUCTS = [
  // Exemples fictifs : remplace par tes vrais produits
  {id:'f1', cat:'Fleurs',  name:'Fleur Classic 2g',  desc:'Description à compléter', price:9.90,  emoji:'🌿'},
  {id:'f2', cat:'Fleurs',  name:'Fleur Premium 5g',  desc:'Description à compléter', price:24.90, emoji:'🌿'},
  {id:'f3', cat:'Fleurs',  name:'Fleur Premium 10g', desc:'Description à compléter', price:44.90, emoji:'🌿'},
  {id:'r1', cat:'Résines', name:'Résine 1g',         desc:'Description à compléter', price:12.00, emoji:'🍯'},
  {id:'r2', cat:'Résines', name:'Résine 3g',         desc:'Description à compléter', price:30.00, emoji:'🍯'},
  {id:'r3', cat:'Résines', name:'Résine 5g',         desc:'Description à compléter', price:45.00, emoji:'🍯'},
];

const CATS = ['Tous', ...new Set(PRODUCTS.map(p => p.cat))];
let activeCat = 'Tous';
const cart = {}; // { id: quantite }

const tabsEl  = document.getElementById('tabs');
const gridEl  = document.getElementById('grid');
const cartBar = document.getElementById('cartbar');
const cbLeft  = document.getElementById('cb-left');
const cbRight = document.getElementById('cb-right');

const fmt = n => n.toFixed(2).replace('.', ',') + ' €';

function cartItems(){
  return Object.entries(cart)
    .filter(([id, q]) => q > 0)
    .map(([id, q]) => { const p = PRODUCTS.find(x => x.id === id); return { name: p.name, price: p.price, qty: q }; });
}
function cartTotal(){
  return cartItems().reduce((s, it) => s + it.price * it.qty, 0);
}

function renderTabs(){
  tabsEl.innerHTML = '';
  CATS.forEach(cat => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tab display' + (cat === activeCat ? ' active' : '');
    el.innerHTML = `<span>${cat}</span>`;
    el.onclick = () => { activeCat = cat; renderTabs(); renderGrid(); };
    tabsEl.appendChild(el);
  });
}

function renderGrid(){
  gridEl.innerHTML = '';
  const list = activeCat === 'Tous' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
  list.forEach(p => {
    const qty = cart[p.id] || 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="visual">
        <span class="tag"><span>${p.cat}</span></span>
        ${p.emoji}
      </div>
      <div class="info">
        <h3 class="name display">${p.name}</h3>
        <div class="desc">${p.desc}</div>
      </div>
      <div class="foot">
        <span class="price">${fmt(p.price)}</span>
        ${qty === 0
          ? `<button class="add" type="button" data-act="add" data-id="${p.id}" aria-label="Ajouter ${p.name}">+</button>`
          : `<div class="stepper">
               <button class="minus" type="button" data-act="sub" data-id="${p.id}" aria-label="Retirer">−</button>
               <span>${qty}</span>
               <button type="button" data-act="add" data-id="${p.id}" aria-label="Ajouter">+</button>
             </div>`
        }
      </div>
    `;
    gridEl.appendChild(card);
  });
}

// Délégation d'événements : un seul écouteur pour toute la grille
gridEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === 'add') cart[id] = (cart[id] || 0) + 1;
  else cart[id] = Math.max(0, (cart[id] || 0) - 1);
  renderGrid();
  updateCart();
});

function updateCart(){
  const count = cartItems().reduce((s, it) => s + it.qty, 0);
  const total = cartTotal();

  if (count === 0){
    cartBar.classList.remove('show');
    tg.MainButton.hide();
    return;
  }
  cbLeft.textContent = `${count} article${count > 1 ? 's' : ''}`;
  cbRight.textContent = `Commander · ${fmt(total)}`;
  cartBar.classList.add('show');

  tg.MainButton.setText(`Commander · ${fmt(total)}`);
  tg.MainButton.show();
}

let sending = false;
async function submitOrder(){
  if (sending) return;
  const items = cartItems();
  if (items.length === 0) return;

  sending = true;
  cartBar.disabled = true;
  tg.MainButton.showProgress();
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ items, total: cartTotal(), initData: tg.initData })
    });
    const data = await res.json();
    if (data.ok) {
      tg.showAlert('Commande envoyée ! Vous serez recontacté(e) rapidement.', () => tg.close());
    } else {
      tg.showAlert("Erreur lors de l'envoi de la commande. Réessaie dans un instant.");
    }
  } catch (e) {
    tg.showAlert('Erreur réseau. Vérifie ta connexion et réessaie.');
  } finally {
    sending = false;
    cartBar.disabled = false;
    tg.MainButton.hideProgress();
  }
}

tg.MainButton.onClick(submitOrder);
cartBar.addEventListener('click', submitOrder);

renderTabs();
renderGrid();
updateCart();
</script>
</body>
</html>
