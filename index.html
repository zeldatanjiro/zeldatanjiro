<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOSSA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #0b0c1a;
    --text: #eef0ff;
    --hint: #8a8fb3;
    --card: #15172b;
    --line: rgba(160,150,255,.12);
    --gold: #9d8bff;           /* accent principal : violet */
    --accent2: #5b8cff;        /* accent secondaire : bleu */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(91,140,255,.18), transparent 60%),
      radial-gradient(800px 400px at 100% 100%, rgba(157,139,255,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding-bottom:100px; min-height:100vh;
  }
  header{padding:28px 16px 10px; text-align:center;}
  header h1{
    margin:0; font-size:24px; letter-spacing:4px; font-weight:800;
    background:linear-gradient(90deg, #7fa6ff, #b7a6ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{margin:8px 0 0; color:var(--hint); font-size:12px; letter-spacing:1.5px; text-transform:uppercase;}

  .tabs{display:flex; gap:8px; padding:14px 16px 6px; overflow-x:auto;}
  .tab{
    flex:0 0 auto; padding:7px 16px; border-radius:20px;
    background:var(--card); color:var(--text); font-size:13px;
    border:1px solid transparent; white-space:nowrap; cursor:pointer;
  }
  .tab.active{border-color:var(--gold); color:#fff; background:rgba(157,139,255,.18); font-weight:600;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:10px 16px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;
    display:flex; flex-direction:column; gap:8px;
    box-shadow:0 8px 24px rgba(0,0,20,.35);
  }
  .card .visual{
    aspect-ratio:1; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:36px;
    background:linear-gradient(135deg, rgba(91,140,255,.22), rgba(157,139,255,.45));
  }
  .card h3{margin:0; font-size:14px; line-height:1.3;}
  .card .price{color:var(--gold); font-weight:700; font-size:14px;}

  .qty-row{display:flex; align-items:center; justify-content:space-between;}
  .qty-btn{
    width:30px; height:30px; border-radius:9px; border:none;
    background:linear-gradient(135deg, #5b8cff, #9d8bff); color:#fff; font-size:17px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-val{font-size:14px; min-width:20px; text-align:center; font-weight:600;}
  .add-btn{
    border:none; border-radius:11px; padding:10px; background:linear-gradient(135deg, #5b8cff, #9d8bff);
    color:#fff; font-weight:700; font-size:13px; width:100%; letter-spacing:.3px;
  }

  footer.note{padding:18px; text-align:center; color:var(--hint); font-size:11px;}
</style>
</head>
<body>

<header>
  <h1>NOSSA</h1>
  <p>Meet up Besançon</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<footer class="note">NOSSA 25</footer>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ------------------------------------------------------------------
// 1) TES PRODUITS — modifie librement cette liste (nom, prix, emoji, catégorie)
// ------------------------------------------------------------------
const PRODUCTS = [
  // Produits d'exemple (fictifs) : remplace par tes vrais produits CBD
  {id:'f1', cat:'Fleurs', name:'Fleur CBD Classic 2g',        price:9.90,  emoji:'🌿'},
  {id:'f2', cat:'Fleurs', name:'Fleur CBD Premium 5g',        price:24.90, emoji:'🌿'},
  {id:'h1', cat:'Huiles', name:'Huile CBD 5% 10ml',           price:19.90, emoji:'💧'},
  {id:'h2', cat:'Huiles', name:'Huile CBD 10% 10ml',          price:34.90, emoji:'💧'},
  {id:'i1', cat:'Infusions', name:'Infusion Relax 20 sachets', price:12.50, emoji:'🍵'},
  {id:'i2', cat:'Infusions', name:'Infusion Menthe Détente',   price:11.90, emoji:'🍃'},
  {id:'c1', cat:'Cosmétiques', name:'Baume CBD Apaisant 30ml',  price:14.90, emoji:'🧴'},
  {id:'c2', cat:'Cosmétiques', name:'Crème CBD Hydratante 50ml', price:16.90, emoji:'🧴'},
];

const CATS = ['Tous', ...new Set(PRODUCTS.map(p=>p.cat))];
let activeCat = 'Tous';
const cart = {}; // { id: quantite }

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');

function renderTabs(){
  tabsEl.innerHTML = '';
  CATS.forEach(cat=>{
    const el = document.createElement('div');
    el.className = 'tab' + (cat === activeCat ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => { activeCat = cat; renderTabs(); renderGrid(); };
    tabsEl.appendChild(el);
  });
}

function renderGrid(){
  gridEl.innerHTML = '';
  const list = activeCat === 'Tous' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
  list.forEach(p=>{
    const qty = cart[p.id] || 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="visual">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="price">${p.price.toFixed(2)} €</div>
      ${qty === 0
        ? `<button class="add-btn" data-add="${p.id}">Ajouter</button>`
        : `<div class="qty-row">
             <button class="qty-btn" data-sub="${p.id}">−</button>
             <span class="qty-val">${qty}</span>
             <button class="qty-btn" data-add="${p.id}">+</button>
           </div>`
      }
    `;
    gridEl.appendChild(card);
  });

  gridEl.querySelectorAll('[data-add]').forEach(btn=>{
    btn.onclick = () => { const id=btn.dataset.add; cart[id]=(cart[id]||0)+1; renderGrid(); updateMainButton(); };
  });
  gridEl.querySelectorAll('[data-sub]').forEach(btn=>{
    btn.onclick = () => { const id=btn.dataset.sub; cart[id]=Math.max(0,(cart[id]||0)-1); renderGrid(); updateMainButton(); };
  });
}

function cartItems(){
  return Object.entries(cart)
    .filter(([id,q])=>q>0)
    .map(([id,q])=>{ const p = PRODUCTS.find(x=>x.id===id); return {name:p.name, price:p.price, qty:q}; });
}
function cartTotal(){
  return cartItems().reduce((s,it)=>s + it.price*it.qty, 0);
}

function updateMainButton(){
  const total = cartTotal();
  if (total <= 0){
    tg.MainButton.hide();
  } else {
    tg.MainButton.setText(`Valider — ${total.toFixed(2)} €`);
    tg.MainButton.show();
  }
}

tg.MainButton.onClick(async () => {
  const items = cartItems();
  const total = cartTotal();
  if (items.length === 0) return;

  tg.MainButton.showProgress();
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ items, total, initData: tg.initData })
    });
    const data = await res.json();
    tg.MainButton.hideProgress();

    if (data.ok) {
      tg.showAlert('Commande envoyée ! Vous serez recontacté(e) rapidement.', () => tg.close());
    } else {
      tg.showAlert("Erreur lors de l'envoi de la commande. Réessaie dans un instant.");
    }
  } catch (e) {
    tg.MainButton.hideProgress();
    tg.showAlert('Erreur réseau. Vérifie ta connexion et réessaie.');
  }
});

renderTabs();
renderGrid();
updateMainButton();
</script>
</body>
</html>
