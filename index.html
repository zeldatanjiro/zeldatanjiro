<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOSSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#070707;
    --surface:#121212;
    --surface-2:#1b1b1b;
    --ink:#0a0a0a;
    --text:#fff8e7;
    --muted:#9d9686;
    --yellow:#ffd400;
    --pink:#ff2e88;
    --line:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0; color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px; min-height:100vh;
    background:
      repeating-linear-gradient(135deg, rgba(255,212,0,.035) 0 14px, transparent 14px 28px),
      var(--bg);
  }
  button{font-family:inherit;}
  .display{font-family:"Anton","Impact",sans-serif; text-transform:uppercase; letter-spacing:.5px; font-weight:400;}
  img{display:block;}

  /* ---------- Accueil ---------- */
  .hero{
    position:relative; overflow:hidden; margin:0 0 4px; padding:26px 18px 22px;
    background:var(--yellow); color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% 88%,0 100%);
  }
  .hero::after{
    content:""; position:absolute; right:-40px; top:-30px; width:180px; height:180px;
    background:var(--pink); opacity:.9; transform:rotate(18deg);
    clip-path:polygon(0 0,100% 0,60% 100%,0 60%);
  }
  .hero .logo{position:relative; z-index:1; font-size:52px; line-height:.9; margin:0;}
  .hero .sub{
    position:relative; z-index:1; margin:8px 0 0; display:inline-block;
    background:var(--ink); color:var(--yellow); font-weight:800; font-size:12px;
    letter-spacing:2px; text-transform:uppercase; padding:5px 10px; transform:skewX(-10deg);
  }
  .hero .sub span{display:inline-block; transform:skewX(10deg);}

  .tabs{display:flex; overflow-x:auto; scrollbar-width:none; padding:16px 18px 6px; margin:0 0 0; border-bottom:2px solid var(--line);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 16px 9px; margin-right:6px; cursor:pointer;
    background:transparent; color:var(--muted); border:none; font-size:18px; letter-spacing:1px; white-space:nowrap;
  }
  .tab.active{color:var(--ink); background:var(--yellow); transform:skewX(-10deg);}
  .tab.active span{display:inline-block; transform:skewX(10deg);}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 18px;}
  .card{
    position:relative; background:var(--surface); border:2px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  }
  .card:active{border-color:var(--yellow);}
  .visual{position:relative; aspect-ratio:1/1; border-bottom:2px solid var(--yellow); background:#0d0d0d;}
  .visual img{width:100%; height:100%; object-fit:cover;}
  .tag{
    position:absolute; top:10px; left:10px; background:var(--pink); color:#fff;
    font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    padding:3px 8px; transform:skewX(-10deg);
  }
  .tag span{display:inline-block; transform:skewX(10deg);}
  .info{padding:10px 12px 14px; display:flex; flex-direction:column; gap:6px;}
  .name{margin:0; font-size:22px; line-height:1;}
  .from{font-size:12px; color:var(--muted);}
  .from b{color:var(--yellow); font-size:14px;}

  .cartbar{
    position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    display:none; align-items:stretch; justify-content:space-between;
    background:var(--pink); color:#fff; border:none; cursor:pointer; padding:0;
    box-shadow:0 0 0 2px var(--ink), 0 12px 30px rgba(255,46,136,.35);
    clip-path:polygon(0 0,100% 0,96% 100%,0 100%);
  }
  .cartbar.show{display:flex;}
  .cartbar .left{
    display:flex; align-items:center; padding:14px 16px; background:var(--ink); color:var(--yellow);
    font-family:"Anton",Impact,sans-serif; font-size:18px; letter-spacing:1px; text-transform:uppercase;
  }
  .cartbar .right{
    display:flex; align-items:center; padding:14px 22px 14px 14px;
    font-family:"Anton",Impact,sans-serif; font-size:20px; letter-spacing:1px; text-transform:uppercase;
  }

  /* ---------- Fiche produit ---------- */
  .pdp{padding:0 0 10px;}
  .pvisual{position:relative; aspect-ratio:1/1; border-bottom:2px solid var(--yellow); background:#0d0d0d;}
  .pvisual img{width:100%; height:100%; object-fit:cover;}
  .pbody{padding:16px 18px;}
  .ptitle{margin:0; font-size:40px; line-height:.95;}
  .pdesc{color:var(--muted); font-size:14px; line-height:1.5; margin:10px 0 0;}
  .label{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:22px 0 10px; font-weight:800;}
  .chips{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .chip{
    background:var(--surface); color:var(--text); border:2px solid var(--line); padding:12px 6px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  }
  .chip b{font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:24px; letter-spacing:.5px;}
  .chip span{font-size:12px; color:var(--muted); font-weight:700;}
  .chip.on{border-color:var(--yellow); background:var(--yellow); color:var(--ink);}
  .chip.on span{color:var(--ink);}
  .chip small{font-size:11px; color:var(--muted); font-weight:600;}
  .chip.on small{color:var(--ink); opacity:.75;}
  .chip .best{
    display:block; background:var(--pink); color:#fff; font-style:normal; font-size:9px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase; padding:2px 6px; margin-bottom:2px; white-space:nowrap;
  }
  .chip.on .best{background:var(--ink); color:var(--yellow);}
  .saving{
    margin:12px 0 0; font-size:13px; font-weight:700; color:var(--yellow);
    border-left:3px solid var(--yellow); padding:4px 0 4px 10px;
  }
  .qrow{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .ptotal{font-family:"Anton",Impact,sans-serif; font-size:30px; color:var(--yellow); letter-spacing:.5px;}

  .stepper{display:flex; align-items:center; gap:6px;}
  .stepper button{
    width:38px; height:38px; border:none; background:var(--yellow); color:var(--ink);
    font-family:"Anton",Impact,sans-serif; font-size:22px; cursor:pointer;
  }
  .stepper button.minus{background:var(--surface-2); color:var(--text);}
  .stepper span{min-width:30px; text-align:center; font-family:"Anton",Impact,sans-serif; font-size:22px; color:var(--yellow);}

  /* ---------- Page d'achat ---------- */
  .cart{padding:16px 18px;}
  .lines{display:flex; flex-direction:column; gap:12px; margin-top:12px;}
  .line{
    display:grid; grid-template-columns:56px 1fr auto; grid-template-rows:auto auto; gap:8px 12px; align-items:center;
    background:var(--surface); border:2px solid var(--line); padding:10px;
  }
  .line img{width:56px; height:56px; border-bottom:none; grid-row:span 2; object-fit:cover; background:#0d0d0d;}
  .lname{font-size:18px; line-height:1;}
  .lunit{font-size:12px; color:var(--muted);}
  .line .stepper{grid-column:2 / 3; grid-row:2;}
  .line .stepper button{width:30px; height:30px; font-size:18px;}
  .lprice{font-family:"Anton",Impact,sans-serif; font-size:20px; color:var(--yellow); text-align:right; grid-column:3; grid-row:1;}
  .summary{display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 6px; border-top:2px solid var(--yellow); padding-top:14px;}
  .summary span{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:800;}
  .summary b{font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:34px; color:var(--yellow);}
  .fine{font-size:12px; color:var(--muted); line-height:1.5; margin:0 0 18px;}
  .ghost{
    width:100%; background:transparent; color:var(--text); border:2px solid var(--line); padding:12px;
    font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }
  .cart-empty{padding:60px 22px; text-align:center;}
  .cart-empty h2{margin:0 0 8px; font-size:34px;}
  .cart-empty p{color:var(--muted); margin:0 0 22px;}

  /* Produit phare : bandeau jaune, carte pleine largeur */
  .star{
    position:absolute; top:10px; right:10px; background:var(--yellow); color:var(--ink);
    font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    padding:4px 9px; transform:skewX(-10deg); box-shadow:0 0 0 2px var(--ink);
  }
  .star span{display:inline-block; transform:skewX(10deg);}
  .card.featured{grid-column:1 / -1; border-color:var(--yellow);}
  .card.featured .visual{aspect-ratio:16/9;}
  .card.featured .name{font-size:34px;}
  .card.featured .from b{font-size:18px;}

  footer.note{padding:20px; text-align:center; color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase;}
</style>
</head>
<body>

<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#070707'); tg.setBackgroundColor('#070707'); } catch (e) {}

// ------------------------------------------------------------------
// TES PRODUITS — modifie librement cette liste
// options = les poids proposés et leur prix (en €)
// img = chemin vers l'image du produit (dossier images/)
// ------------------------------------------------------------------
const PRODUCTS = [
  {id:'lemon', cat:'Fleurs', name:'Lemon Synth', img:'images/lemon-synth.svg', featured:true,
   desc:'Notre produit phare. Plus tu prends de grammes, moins le gramme te coûte cher. Description à compléter.',
   options:[{g:3, price:30}, {g:5, price:45}, {g:10, price:85}]},
  {id:'fleur-premium', cat:'Fleurs', name:'Fleur Premium', img:'images/fleur-premium.svg',
   desc:'Description à compléter.',
   options:[{g:3, price:36}, {g:5, price:60}, {g:10, price:110}]},
  {id:'resine-classic', cat:'Résines', name:'Résine Classic', img:'images/resine-classic.svg',
   desc:'Description à compléter.',
   options:[{g:1, price:12}, {g:3, price:30}, {g:5, price:45}]},
  {id:'resine-premium', cat:'Résines', name:'Résine Premium', img:'images/resine-premium.svg',
   desc:'Description à compléter.',
   options:[{g:1, price:14}, {g:3, price:36}, {g:5, price:55}]},
];

// ------------------------------------------------------------------
// Données et panier
// ------------------------------------------------------------------
const CATS = ['Tous', ...new Set(PRODUCTS.map(p => p.cat))];
const cart = {}; // clé "produit|poids" -> quantité
const findP = id => PRODUCTS.find(p => p.id === id);
const fmt = n => n.toFixed(2).replace('.', ',') + ' €';
const keyOf = (pid, g) => `${pid}|${g}`;

function lines(){
  return Object.entries(cart)
    .filter(([k, q]) => q > 0)
    .map(([k, q]) => {
      const [pid, g] = k.split('|');
      const p = findP(pid);
      const o = p.options.find(x => String(x.g) === g);
      return { key: k, p, g: o.g, price: o.price, qty: q, name: `${p.name} ${o.g} g` };
    });
}
const cartCount = () => lines().reduce((s, l) => s + l.qty, 0);
const cartTotal = () => lines().reduce((s, l) => s + l.price * l.qty, 0);

// ------------------------------------------------------------------
// Navigation : accueil -> fiche produit -> panier
// ------------------------------------------------------------------
const app = document.getElementById('app');
let view = { name: 'shop' };
const stack = [];
let activeCat = 'Tous';
let pick = { g: null, qty: 1 };

function go(v){
  stack.push(view);
  view = v;
  if (v.name === 'product') pick = { g: findP(v.id).options[0].g, qty: 1 };
  render();
}
function back(){
  view = stack.length ? stack.pop() : { name: 'shop' };
  render();
}
function home(){
  stack.length = 0;
  view = { name: 'shop' };
  render();
}

function shopHTML(){
  // Le produit phare passe toujours en premier, en pleine largeur
  const list = (activeCat === 'Tous' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat))
    .slice().sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  const n = cartCount();
  return `
    <header class="hero">
      <h1 class="logo display">NOSSA</h1>
      <p class="sub"><span>Meet up Besançon · Fleurs &amp; Résines</span></p>
    </header>
    <nav class="tabs">
      ${CATS.map(c => `<button type="button" class="tab display ${c === activeCat ? 'active' : ''}" data-cat="${c}"><span>${c}</span></button>`).join('')}
    </nav>
    <main class="grid">
      ${list.map(p => {
        const min = Math.min(...p.options.map(o => o.price));
        return `
        <div class="card ${p.featured ? 'featured' : ''}" data-open="${p.id}" role="button" tabindex="0">
          <div class="visual"><img src="${p.img}" alt="${p.name}"><span class="tag"><span>${p.cat}</span></span>${p.featured ? '<span class="star"><span>Produit phare</span></span>' : ''}</div>
          <div class="info">
            <h3 class="name display">${p.name}</h3>
            <div class="from">dès <b>${fmt(min)}</b></div>
          </div>
        </div>`;
      }).join('')}
    </main>
    <footer class="note">NOSSA 25</footer>
    <button type="button" class="cartbar ${n ? 'show' : ''}" data-go="cart">
      <span class="left">${n} article${n > 1 ? 's' : ''}</span>
      <span class="right">Commander · ${fmt(cartTotal())}</span>
    </button>`;
}

// Format le plus avantageux au gramme (prix dégressif)
function bestValue(p){
  return p.options.reduce((best, o) => (o.price / o.g < best.price / best.g ? o : best));
}

// Économie réelle par rapport au prix au gramme du plus petit format
function savingsLine(p, opt){
  const base = p.options[0];
  const saved = base.price / base.g * opt.g - opt.price;
  if (opt === base || saved <= 0.005) return '';
  return `<p class="saving">Tu économises ${fmt(saved)} par rapport au prix du ${base.g} g.</p>`;
}

function productHTML(){
  const p = findP(view.id);
  const opt = p.options.find(o => o.g === pick.g);
  return `
    <section class="pdp">
      <div class="pvisual"><img src="${p.img}" alt="${p.name}"><span class="tag"><span>${p.cat}</span></span>${p.featured ? '<span class="star"><span>Produit phare</span></span>' : ''}</div>
      <div class="pbody">
        <h1 class="ptitle display">${p.name}</h1>
        <p class="pdesc">${p.desc}</p>

        <div class="label">Poids</div>
        <div class="chips">
          ${p.options.map(o => `
            <button type="button" class="chip ${o.g === pick.g ? 'on' : ''}" data-g="${o.g}">
              ${o.g === bestValue(p).g ? '<em class="best">Meilleur prix/g</em>' : ''}
              <b>${o.g} g</b><span>${fmt(o.price)}</span>
              <small>${fmt(o.price / o.g)}/g</small>
            </button>`).join('')}
        </div>
        ${savingsLine(p, opt)}

        <div class="label">Quantité</div>
        <div class="qrow">
          <div class="stepper">
            <button type="button" class="minus" data-pqty="-1" aria-label="Retirer">−</button>
            <span>${pick.qty}</span>
            <button type="button" data-pqty="1" aria-label="Ajouter">+</button>
          </div>
          <div class="ptotal">${fmt(opt.price * pick.qty)}</div>
        </div>
      </div>
    </section>`;
}

function cartHTML(){
  const ls = lines();
  if (!ls.length){
    return `
      <section class="cart-empty">
        <h2 class="display">Panier vide</h2>
        <p>Ajoute un produit pour commander.</p>
        <button type="button" class="ghost" data-go="home">Voir la boutique</button>
      </section>`;
  }
  return `
    <section class="cart">
      <h1 class="ptitle display">Ma commande</h1>
      <div class="lines">
        ${ls.map(l => `
          <div class="line">
            <img src="${l.p.img}" alt="">
            <div class="lname display">${l.name}</div>
            <div class="lprice">${fmt(l.price * l.qty)}</div>
            <div class="stepper">
              <button type="button" class="minus" data-lqty="-1" data-key="${l.key}" aria-label="Retirer">−</button>
              <span>${l.qty}</span>
              <button type="button" data-lqty="1" data-key="${l.key}" aria-label="Ajouter">+</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="summary"><span>Total</span><b>${fmt(cartTotal())}</b></div>
      <p class="fine">Ta commande est envoyée au vendeur, qui te recontacte pour finaliser.</p>
      <button type="button" class="ghost" data-go="home">+ Ajouter d'autres produits</button>
    </section>`;
}

// Barre Telegram : bouton retour + bouton principal, selon la page affichée
function chrome(){
  if (view.name === 'shop') tg.BackButton.hide(); else tg.BackButton.show();

  if (view.name === 'product'){
    const opt = findP(view.id).options.find(o => o.g === pick.g);
    tg.MainButton.setText(`Ajouter au panier · ${fmt(opt.price * pick.qty)}`);
    tg.MainButton.show();
  } else if (view.name === 'cart' && cartCount()){
    tg.MainButton.setText(`Commander · ${fmt(cartTotal())}`);
    tg.MainButton.show();
  } else {
    tg.MainButton.hide();
  }
}

function render(){
  if (view.name === 'shop') app.innerHTML = shopHTML();
  else if (view.name === 'product') app.innerHTML = productHTML();
  else app.innerHTML = cartHTML();
  chrome();
}

// Un seul écouteur pour toute l'application
app.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-open],[data-go],[data-g],[data-pqty],[data-lqty]');
  if (!t) return;
  const d = t.dataset;
  if (d.cat !== undefined){ activeCat = d.cat; render(); }
  else if (d.open !== undefined) go({ name: 'product', id: d.open });
  else if (d.go !== undefined){ d.go === 'cart' ? go({ name: 'cart' }) : home(); }
  else if (d.g !== undefined){ pick.g = Number(d.g); pick.qty = 1; render(); }
  else if (d.pqty !== undefined){ pick.qty = Math.min(20, Math.max(1, pick.qty + Number(d.pqty))); render(); }
  else if (d.lqty !== undefined){
    const k = d.key;
    cart[k] = Math.max(0, (cart[k] || 0) + Number(d.lqty));
    if (!cart[k]) delete cart[k];
    render();
  }
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')){
    e.preventDefault(); go({ name: 'product', id: e.target.dataset.open });
  }
});

function addToCart(){
  const k = keyOf(view.id, pick.g);
  cart[k] = (cart[k] || 0) + pick.qty;
  back();
}

let sending = false;
async function submitOrder(){
  if (sending) return;
  const items = lines();
  if (!items.length) return;

  sending = true;
  tg.MainButton.showProgress();
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // Le serveur recalcule les prix : on n'envoie ni prix ni total
      body: JSON.stringify({
        items: items.map(l => ({ id: l.p.id, g: l.g, qty: l.qty })),
        initData: tg.initData
      })
    });
    const data = await res.json().catch(() => ({}));
    if (data.ok){
      for (const k of Object.keys(cart)) delete cart[k];
      render();
      tg.showAlert('Commande envoyée ! Vous serez recontacté(e) rapidement.', () => tg.close());
    } else {
      tg.showAlert(data.error || "Erreur lors de l'envoi de la commande. Réessaie dans un instant.");
    }
  } catch (e) {
    tg.showAlert('Erreur réseau. Vérifie ta connexion et réessaie.');
  } finally {
    sending = false;
    tg.MainButton.hideProgress();
  }
}

tg.MainButton.onClick(() => {
  if (view.name === 'product') addToCart();
  else if (view.name === 'cart') submitOrder();
});
tg.BackButton.onClick(back);

render();
</script>
</body>
</html>
